<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cordlet · Simple voice</title><link rel="stylesheet" href="../theme/tokens.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:16px/1.5 system-ui,sans-serif}main{max-width:440px;margin:auto;min-height:100svh;padding:28px 26px 24px;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:16px}button{font:inherit;cursor:pointer;border:none}button:focus-visible{outline:2px solid var(--secondary);outline-offset:4px}.back{background:var(--surface);color:var(--text);width:44px;height:44px;border-radius:14px;font-size:24px}header span{font-weight:650;letter-spacing:.2px}.dest{margin:32px 0 0;color:var(--text-secondary);font-size:13px}.dest strong{color:var(--text);font-weight:550}h1{font-size:30px;letter-spacing:-1px;font-weight:600;margin:10px 0 0}.card{margin:auto 0;background:var(--surface);border:1px solid var(--outline);border-radius:var(--radius-panel);padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.live{font-size:14px;font-weight:550}.live:before{content:'●';color:var(--primary);margin-right:9px}.time{font-size:14px;color:var(--text-secondary);font-variant-numeric:tabular-nums}.wave{height:140px;display:flex;align-items:center;justify-content:center;gap:5px;overflow:hidden}.wave i{width:4px;flex-shrink:0;background:var(--primary);border-radius:3px;animation:level .8s ease-in-out infinite alternate}@keyframes level{to{transform:scaleY(.35)}}body.paused .wave i,body.sent .wave i{animation-play-state:paused}.hint{font-size:13px;text-align:center;color:var(--text-secondary);margin:0}.review{display:none;margin:14px auto 0;background:var(--surface-inset);color:var(--secondary);border:1px solid var(--outline);border-radius:12px;padding:10px 18px}body.paused .review{display:block}.controls{display:grid;grid-template-columns:1fr 1.6fr;gap:12px;margin-top:26px}.controls button{height:58px;border-radius:var(--radius-control);font-weight:650}.pause{background:var(--surface);border:1px solid var(--outline);color:var(--text)}.send{background:var(--primary);color:var(--on-primary)}.discard{align-self:center;margin:16px 0 20px;background:transparent;color:var(--text-secondary);font-size:13px;padding:10px}.demo{text-align:center;font-size:10px;letter-spacing:.5px;color:var(--text-secondary);margin:0}.controls button:disabled{opacity:.5;cursor:default}
</style></head><body><main><header><button class="back" aria-label="Back" onclick="document.getElementById('hint').textContent='Back to composer (preview only)'">‹</button><span>Cordlet</span></header><p class="dest">Voice note to <strong>Wren</strong></p><h1>Say what’s on your mind.</h1><section class="card"><div class="top"><span class="live" id="state">Recording</span><span class="time" id="time">00:12</span></div><div class="wave" id="wave" aria-label="Simulated microphone activity"></div><p class="hint" id="hint">Pause to review, or send when you’re done.</p><button class="review" id="play" onclick="this.textContent=this.textContent.includes('Play')?'Ⅱ Stop preview':'▷ Play recording'">▷ Play recording</button></section><div class="controls"><button class="pause" id="pause">Ⅱ Pause</button><button class="send" id="send">Send ↗</button></div><button class="discard" id="discard">Discard recording</button><p class="demo">DESIGN PREVIEW · SIMULATED AUDIO · NO UPLOAD</p></main><script>
const wave=document.getElementById('wave');for(let i=0;i<43;i++){const bar=document.createElement('i');bar.style.height=(12+Math.abs(Math.sin(i*1.73))*70*(.3+.7*Math.sin(Math.PI*i/42)))+'px';bar.style.animationDelay=(-i*.13)+'s';wave.appendChild(bar)}let paused=false,secs=12,sending=false,sent=false;const state=document.getElementById('state'),pause=document.getElementById('pause'),send=document.getElementById('send'),hint=document.getElementById('hint');setInterval(()=>{if(!paused&&!sending&&!sent){secs++;document.getElementById('time').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')}},1000);pause.onclick=()=>{paused=!paused;document.body.classList.toggle('paused',paused);state.textContent=paused?'Paused':'Recording';pause.textContent=paused?'● Resume':'Ⅱ Pause';hint.textContent=paused?'Listen back, resume, or send.':'Pause to review, or send when you’re done.'};send.onclick=()=>{sending=true;document.body.classList.remove('paused');document.body.classList.add('sent');state.textContent='Sending…';send.disabled=pause.disabled=true;hint.textContent='Uploading recording (simulated).';setTimeout(()=>{state.textContent='Accepted by Hermes';hint.textContent='Reply will arrive in Discord (simulated).';send.textContent='Accepted ✓';sent=true;sending=false},1000)};document.getElementById('discard').onclick=()=>location.reload();
</script></body></html>
