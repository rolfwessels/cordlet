name: cordlet

services:
  dev:
    container_name: cordlet-dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
        ANDROID_COMPILE_SDK: ${ANDROID_COMPILE_SDK:-36}
        ANDROID_BUILD_TOOLS: ${ANDROID_BUILD_TOOLS:-36.0.0}
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cordlet-gradle-cache:/home/developer/.gradle
      - cordlet-android-cache:/home/developer/.android
    environment:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      GRADLE_USER_HOME: /home/developer/.gradle
    init: true
    stdin_open: true
    tty: true

volumes:
  cordlet-gradle-cache:
  cordlet-android-cache:
